name: Build Binaries

on:
  workflow_call:
    inputs:
      release_name:
        description: "allow setting the release name"
        default: "latest"
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish
    if: always() && !cancelled()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        if: always() && !cancelled()
        uses: actions/download-artifact@v4
        with:
          name: Firmware

      - name: Upload UF2 artifact mirror
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: totem-firmware
          path: |
            **/*.uf2
            **/*.hex
            **/*.bin
          if-no-files-found: warn
